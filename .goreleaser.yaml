version: 2

builds:
  - id: inkshade
    env: &env
      - CGO_ENABLED=0
    goos: &goos
      - linux
      - darwin
      - windows
    goarch: &goarch
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
  - id: inkshade-claude-hook
    main: ./cmd/inkshade-claude-hook
    binary: inkshade-claude-hook
    env: *env
    goos: *goos
    goarch: *goarch
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

brews:
  - repository:
      owner: toritori0318
      name: inkshade
    directory: Formula
    homepage: "https://github.com/toritori0318/inkshade"
    description: "Mask PII and credentials in text streams"
    license: "MIT"
    install: |
      bin.install "inkshade", "inkshade-claude-hook"
    test: |
      assert_match version.to_s, shell_output("#{bin}/inkshade --version")

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
