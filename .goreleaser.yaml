version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

brews:
  - repository:
      owner: toritori0318
      name: inkshade
    directory: Formula
    homepage: "https://github.com/toritori0318/inkshade"
    description: "Mask PII and credentials in text streams"
    license: "MIT"
    install: |
      bin.install "inkshade"
    test: |
      assert_match version.to_s, shell_output("#{bin}/inkshade --version")

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
